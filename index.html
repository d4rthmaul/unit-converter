<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerdy Unit Converter</title>
    <meta name="description" content="Convert real units, and the ones from Star Trek, Tolkien, Harry Potter and more, on a slide rule.">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--
        The converter. Most of the page is filled in by script.js from the data in units.js:
        the category buttons, both unit pickers, the result, the slide rule's ticks (rule.js)
        and the source footnotes. Script order matters: units.js, then rule.js, then script.js.
    -->
    <div class="page">
        <header class="masthead">
            <div class="masthead-title">
                <h1>Nerdy Unit Converter</h1>
                <div class="ruler-ticks" aria-hidden="true"></div>
                <p class="tagline">Real units, and the ones from Star Trek, Tolkien, Harry Potter and more.</p>
            </div>
            <button class="text-btn theme-toggle" type="button" data-theme-toggle>
                <svg class="theme-icon theme-icon-moon" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
                <svg class="theme-icon theme-icon-sun" width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" stroke="currentColor" stroke-width="1.4"/></svg>
                <span class="theme-toggle-label">Switch to night mode</span>
            </button>
        </header>

        <!-- Categories: one button per category, drawn as ticks along a ruler line. -->
        <nav class="cat-rule" id="categoryNav" aria-label="Categories"></nav>

        <section class="converter" aria-label="Converter">
            <!-- The sentence: "[number] [unit]¹ = [result] [unit]²". The superscripts point to the footnotes. -->
            <div class="sentence">
                <span class="sentence-part">
                    <label for="inputValue" class="visually-hidden">Number to convert</label>
                    <input type="number" id="inputValue" class="value-input" value="1" step="any" inputmode="decimal">
                    <span class="visually-hidden" id="fromLabel">From unit</span>
                    <span class="picker" id="fromPicker" data-footnote="1"></span>
                </span>
                <span class="sentence-part">
                    <span class="equals" aria-hidden="true">=</span>
                    <output class="result" id="result" for="inputValue" aria-live="polite">—</output>
                    <span class="visually-hidden" id="toLabel">To unit</span>
                    <span class="picker" id="toPicker" data-footnote="2"></span>
                </span>
            </div>

            <!-- The slide rule. Hidden from screen readers (the sentence says it all); the caption explains it. -->
            <figure class="rule" id="rule" aria-label="Slide rule comparing the two units">
                <div class="rule-face">
                    <div class="rule-edge rule-edge-top" data-rule-top-name></div>
                    <div class="rule-edge rule-edge-bottom" data-rule-bottom-name></div>
                    <div class="rule-strip" aria-hidden="true"><div class="rule-strip-inner"></div></div>
                    <div class="rule-track" aria-hidden="true">
                        <div class="rule-scale-upper"></div>
                        <div class="rule-scale-lower"></div>
                        <div class="rule-cursor"></div>
                    </div>
                </div>
                <div class="rule-legend" aria-hidden="true"><span data-rule-legend-top></span><span data-rule-legend-bottom></span></div>
                <figcaption class="rule-caption" data-rule-caption></figcaption>
            </figure>

            <div class="actions">
                <button class="text-btn" id="swapButton" type="button">Swap units</button>
                <button class="text-btn" id="copyButton" type="button">Copy result</button>
                <button class="text-btn text-btn-strong" id="randomButton" type="button">Surprise me with something absurd</button>
            </div>
            <p class="visually-hidden" id="copyStatus" role="status"></p>
        </section>

        <!-- Footnotes 1 and 2: description and source for each unit in the sentence. -->
        <section class="sources" id="sources" aria-label="Sources for these units"></section>

        <footer class="site-footer">
            <a href="references.html">Unit References</a>
            <a href="credits.html">Credits and disclaimer</a>
        </footer>
    </div>
    <script src="units.js"></script>
    <script src="rule.js"></script>
    <script src="script.js"></script>
</body>
</html>
