<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerdy Unit Converter</title>
    <meta name="description" content="Convert real units — and fictional ones from Star Trek, Tolkien, Harry Potter and more.">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3" stroke="currentColor" stroke-width="1.4"/></svg>
                <span class="theme-toggle-label">Terminal mode</span>
            </button>
        </div>

        <header class="site-header">
            <div class="eyebrow">The Dimensional Analysis Machine</div>
            <h1>Nerdy Unit Converter</h1>
            <p class="tagline">Convert real units — and fictional ones from Star Trek, Tolkien, Harry Potter and more.</p>
        </header>

        <nav class="chips" id="categoryChips" aria-label="Categories"></nav>

        <section class="panel converter" aria-label="Converter">
            <div class="row">
                <div class="field-value">
                    <label class="field-label" for="inputValue">From</label>
                    <input type="number" id="inputValue" class="value-input" value="1" step="any" inputmode="decimal">
                </div>
                <div class="field-unit">
                    <span class="field-label" id="fromLabel">Unit</span>
                    <div class="picker" id="fromPicker"></div>
                </div>
            </div>

            <div class="swap-row">
                <button id="swapButton" class="icon-btn" type="button" aria-label="Swap units">
                    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 2v13M6 15l-3-3M6 15l3-3M12 16V3M12 3l-3 3M12 3l3 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
                </button>
            </div>

            <div>
                <span class="field-label" id="toLabel">To</span>
                <div class="picker" id="toPicker"></div>
            </div>

            <div class="result" aria-live="polite">
                <span class="field-label">Result</span>
                <div class="result-main">
                    <span class="result-number" id="resultNumber">—</span>
                    <span class="result-unit" id="resultUnit"></span>
                </div>
                <div class="result-foot">
                    <p class="result-sentence" id="resultSentence"></p>
                    <button class="ghost-btn" id="copyButton" type="button">
                        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M2 10V3a1 1 0 0 1 1-1h7" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
                        <span id="copyLabel">Copy</span>
                    </button>
                </div>
            </div>

            <button class="primary-btn" id="randomButton" type="button">
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="6" cy="6" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="9" cy="9" r="1.3" fill="currentColor"/></svg>
                Random nerdy conversion
            </button>
        </section>

        <section class="panel info" id="unitInfo" aria-label="Unit info">
            <span class="field-label">Unit info</span>
        </section>

        <footer class="site-footer">
            <span id="unitCount">Every unit sourced</span>
            <a href="references.html">All units &amp; sources →</a>
        </footer>
    </div>
    <script src="units.js"></script>
    <script src="script.js"></script>
</body>
</html>
